   Transparent checklist scoring based on the trader's own configured limits.
   It is a discipline aid, not a signal generator or a guarantee of trade outcomes. */
const ptChecks=[
  ['trend','Higher-timeframe direction supports this trade'],
  ['setup','A valid setup from my trading plan is present'],
  ['trigger','My entry trigger is confirmed (not anticipated)'],
  ['sl','A logical stop-loss is defined before entry'],
  ['tp','A realistic take-profit is defined'],
  ['news','No high-impact event conflicts with my trading plan'],
  ['session','This is an approved trading session'],
  ['calm','I am calm, focused and not revenge-trading']
];
function ptRead(){
  const get=id=>document.getElementById('pt-'+id);
  const checked=id=>!!(get(id)&&get(id).checked);
  const risk=n(get('pt-risk')?.value), rr=n(get('pt-rr')?.value);
  const cfg=S.pretradeCfg||{maxRisk:1,minRR:2};
  const riskOK=risk!=null&&risk>0&&risk<=Number(cfg.maxRisk||1);
  const rrOK=rr!=null&&rr>=Number(cfg.minRR||2);
  const checks=ptChecks.map(([id,label])=>({id,label,ok:checked(id)}));
  checks.push({id:'risk',label:`Risk is within ${cfg.maxRisk}% limit`,ok:riskOK});
  checks.push({id:'rr',label:`Planned R:R meets ${cfg.minRR}:1 minimum`,ok:rrOK});
  const hard=[];
  if(!checked('setup'))hard.push('No valid setup from your plan');
  if(!checked('sl'))hard.push('Stop-loss is not defined');
  if(!checked('news'))hard.push('News conditions are not cleared');
  if(risk==null||risk<=0)hard.push('Enter a valid risk percentage');
  else if(!riskOK)hard.push(`Risk exceeds your ${cfg.maxRisk}% limit`);
  const soft=[];
  if(!checked('trend'))soft.push('Higher-timeframe direction is not aligned');
  if(!checked('trigger'))soft.push('Entry trigger is not confirmed');
  if(!checked('tp'))soft.push('Take-profit is not planned');
  if(!checked('session'))soft.push('Outside your approved session');
  if(!checked('calm'))soft.push('You do not feel calm and focused');
  if(!rrOK)soft.push(`Planned R:R is below ${cfg.minRR}:1`);
  const score=Math.round(checks.filter(x=>x.ok).length/checks.length*100);
  const decision=hard.length?'NO TRADE':(soft.length||score<80?'WAIT':'READY');
  return {score,decision,hard,soft,checks,risk,rr};
}
function ptAssess(){
  const out=document.getElementById('pt-result');if(!out)return;
  const a=ptRead(),tone=a.decision==='READY'?'g':a.decision==='WAIT'?'a':'r';
  out.innerHTML=`<div class="card" style="border-color:var(--${tone})">
    <div class="bar"><b>Decision check</b><span class="pill ${tone}">${a.decision}</span><span class="m">Checklist score: <b>${a.score}/100</b></span></div>
    <div class="br"><span>Readiness</span><i style="width:${a.score}%;background:var(--${tone})"></i><b>${a.score}%</b></div>
    ${a.hard.length?`<p class="r"><b>Hard blockers</b></p><ul>${a.hard.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}

    ${!a.hard.length&&!a.soft.length?'<p class="g">All configured checklist conditions passed. This is not a prediction of profitability.</p>':''}
    <p class="m">This result checks your own inputs and limits. It does not analyse live prices or tell you which direction to trade.</p>
  </div>`;
  return a;
}

<style>
#un-card{position:fixed;top:84px;right:16px;z-index:20;width:216px;background:rgba(10,14,22,.94);border:1px solid rgba(77,232,255,.28);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.5);backdrop-filter:blur(14px);font-size:12.5px;line-height:1.3;color:var(--t)}
#un-card[hidden]{display:none}
#un-card .un-h{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:11.5px;letter-spacing:.4px;user-select:none}
#un-card .un-dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}
#un-card .un-c{margin-left:auto;color:var(--m);font-size:14px}
#un-card .un-b{border-top:1px solid var(--b)}
#un-card.un-min .un-b{display:none}
#un-l{max-height:176px;overflow-y:auto;padding:3px 0}
#un-card .un-d{padding:5px 11px 1px;font-size:10.5px;color:var(--m)}
#un-card .un-r{display:flex;align-items:center;gap:9px;padding:4px 11px}
#un-card .un-r:hover{background:rgba(77,232,255,.06)}
#un-card .un-t{width:62px;flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--g)}
#un-card .un-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#un-card .un-p .un-t,#un-card .un-p .un-n{color:var(--m);font-weight:400}
#un-card .un-x{display:none;cursor:pointer;color:var(--r);font-size:15px;line-height:1;padding:0 2px}
#un-card .un-r:hover .un-x{display:block}
#un-card .un-e{padding:10px 11px;color:var(--m)}
#un-card .un-f{display:none;flex-direction:column;gap:6px;padding:9px 11px;border-top:1px solid var(--b)}
#un-card .un-f.un-o{display:flex}
#un-card .un-f input{width:100%;padding:6px 8px}
#un-card .un-s{display:flex;gap:5px}#un-card .un-s{align-items:stretch}#un-card .un-s input{min-width:0;flex:1;width:0;padding:6px 4px;text-align:center}#un-card .un-co{align-self:center;color:var(--m);font-weight:700}#un-card .un-s select{flex:none;width:62px;padding:6px 4px}
#un-card .un-a{display:flex;gap:6px}#un-card .un-a button{flex:1;padding:6px}

</style>
<div id="un-card" hidden>
  <div class="un-h" id="un-h"><span class="un-dot"></span>UPCOMING NEWS<span class="un-c" id="un-c">–</span></div>
  <div class="un-b">
    <div id="un-l"></div>
    <div class="un-f" id="un-f">
      <input id="un-name" type="text" maxlength="40" placeholder="Event name" aria-label="Event name">
      <input id="un-date" type="date" aria-label="Date"><div class="un-s"><input id="un-hr" type="text" inputmode="numeric" maxlength="2" placeholder="Hr" aria-label="Hour"><span class="un-co">:</span><input id="un-min" type="text" inputmode="numeric" maxlength="2" placeholder="Min" aria-label="Minute"><select id="un-ap" aria-label="AM or PM"><option>AM</option><option>PM</option></select></div>
      <div class="un-a"><button type="button" class="s" id="un-cancel">Cancel</button><button type="button" id="un-save">Save</button></div>
    </div>
    <button type="button" class="s un-add" id="un-add">+ Add event</button>
  </div>
</div>
<script>
(function(){
  const U=id=>document.getElementById(id);
  const list=()=>{if(!Array.isArray(S.news))S.news=[];return S.news};
  const t12=t=>{const p=t.split(':'),h=+p[0];return String(h%12||12).padStart(2,'0')+':'+p[1]+' '+(h>=12?'PM':'AM')};
  const nowT=()=>new Date().toLocaleTimeString('en-GB',{timeZone:S.cfg.tz,hour:'2-digit',minute:'2-digit',hour12:false});
  function render(){
    const card=U('un-card');if(!card)return;
    card.hidden=G.v!=='dash';
    if(card.hidden)return;
    const td=today(),tm=addD(td,1),nt=nowT();
    const ev=list().filter(e=>e.date===td||e.date===tm).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    let h='',last='';
    ev.forEach(e=>{
      if(e.date!==last){h+='<div class="un-d">'+(e.date===td?'Today':'Tomorrow')+'</div>';last=e.date}
      h+='<div class="un-r'+(e.date===td&&e.time<nt?' un-p':'')+'"><span class="un-t">'+t12(e.time)+'</span><span class="un-n" title="'+esc(e.name)+'">'+esc(e.name)+'</span><span class="un-x" role="button" tabindex="0" data-id="'+esc(e.id)+'" aria-label="Remove event">×</span></div>';
    });
    U('un-l').innerHTML=h||'<div class="un-e">No events today or tomorrow.</div>';
    U('un-c').textContent=card.classList.contains('un-min')?(ev.length?ev.length+' ▾':'▾'):'▴';
  }
  function form(open){
    U('un-f').classList.toggle('un-o',open);
    U('un-add').style.display=open?'none':'block';
    if(open){U('un-name').value='';U('un-date').value=today();U('un-hr').value='';U('un-min').value='';U('un-ap').value='AM';U('un-name').focus()}
  }
  U('un-h').onclick=()=>{U('un-card').classList.toggle('un-min');render()};
  U('un-add').onclick=()=>form(true);
  U('un-cancel').onclick=()=>form(false);
  U('un-save').onclick=()=>{
    const name=U('un-name').value.trim(),date=U('un-date').value,hs=U('un-hr').value.trim(),ms=U('un-min').value.trim();
    if(!name){U('un-name').focus();return}if(!date){U('un-date').focus();return}
    const hr=+hs,mi=ms===''?0:+ms;
    if(!/^\d{1,2}$/.test(hs)||hr<1||hr>12){toast('Type the hour as 1 to 12');U('un-hr').focus();return}
    if(!/^\d{0,2}$/.test(ms)||mi>59){toast('Type the minutes as 00 to 59');U('un-min').focus();return}
    const ap=U('un-ap').value,time=String(hr%12+(ap==='PM'?12:0)).padStart(2,'0')+':'+String(mi).padStart(2,'0');
    list().push({id:'N'+(++S.seq),name,date,time});
    if(save()){form(false);render()}
  };
  U('un-l').onclick=e=>{
    const x=e.target.closest('.un-x');if(!x)return;
    S.news=list().filter(v=>String(v.id)!==x.dataset.id);save();render();
  };
  U('un-f').onkeydown=e=>{if(e.key==='Enter')U('un-save').click();if(e.key==='Escape')form(false)};
  // keep the widget in step with the journal: re-render whenever the app redraws, and every minute
  const baseGo=go;
  go=function(){const r=baseGo.apply(this,arguments);render();return r};
  if(window.innerWidth<=800)U('un-card').classList.add('un-min');
  setInterval(render,60000);
  render();
})();
</script>
